# Robot Configuration for ArUco Camera Localizer
# This file contains robot-specific parameters for camera and TF connections

# ============================================================================
# ACTIVE ROBOT SELECTION
# ============================================================================
# Select which robot configuration to use: 'ur5e' or 'robosort'
active_robot: 'so_arm101'

# ============================================================================
# ROBOT CONFIGURATIONS
# ============================================================================
robots:
  # --------------------------------------------------------------------------
  # UR5e Robot Configuration
  # --------------------------------------------------------------------------
  ur5e:
    # ROS Topics
    topics:
      # Topic to subscribe to for end-effector pose
      # Expected message type: geometry_msgs/msg/PoseStamped
      # Expected content:
      #   - header.frame_id: robot base frame (e.g., "base")
      #   - pose.position: [x, y, z] in meters (base frame)
      #   - pose.orientation: quaternion [x, y, z, w] (base frame)
      tcp_pose: '/tcp_pose_broadcaster/pose'
    
    # Camera parameters
    camera:
      # Camera resolution (pixels)
      width: 1280
      height: 720
      
      # Field of view (degrees)
      horizontal_fov: 69.4
      vertical_fov: 42.5
      
      # OpenCV frame to Camera frame transformation
      # OpenCV convention: X=right, Y=down, Z=forward (in image)
      # This quaternion aligns OpenCV frame with physical camera's coordinate system
      opencv_to_camera:
        # For downward-facing camera (default)
        quaternion: [0.0, 0.0, 0.0, 1.0]  # identity (no rotation)
    
    # Detection settings
    detection: {}

    # Transform (TF) configuration
    transforms:
      # Default/Home position of end-effector in base frame
      ee_default:
        position: [-0.144, -0.435, 0.202]  # meters [x, y, z]
        quaternion: [0.0, 1.0, 0.0, 0.0]  # [x, y, z, w] - 180° Y rotation
      
      # Default camera pose in base frame (calculated from camera_to_ee offset)
      # Camera-to-EE offset: [-0.012, -0.048, -0.01] with identity rotation
      camera_default:
        position: [-0.156, -0.483, 0.192]  # meters [x, y, z]
        quaternion: [0.0, 1.0, 0.0, 0.0]  # [x, y, z, w] - same as EE
      
      # Calibration offsets for fine-tuning object positions (meters)
      calibration_offset:
        x: 0.004  # 4mm correction in x
        y: 0.002  # 2mm correction in y
        z: 0.0    # Z adjustment

  # --------------------------------------------------------------------------
  # Robosort Robot Configuration
  # --------------------------------------------------------------------------
  robosort:
    # ROS Topics
    topics:
      # Topic to subscribe to for end-effector pose
      # Expected message type: geometry_msgs/msg/PoseStamped
      # Expected content:
      #   - header.frame_id: robot base frame (e.g., "base")
      #   - pose.position: [x, y, z] in meters (base frame)
      #   - pose.orientation: quaternion [x, y, z, w] (base frame)
      tcp_pose: '/ee_pose'
    
    # Camera parameters
    camera:
      # Camera resolution (pixels)
      width: 640
      height: 480
      
      # Field of view (degrees)
      # NOTE: Gazebo camera has square pixels (fx=fy=462.17), which means
      # correct vfov should be 54.9°. However, vfov=42.5° (fy=617) partially
      # compensates for a systematic ray direction bias (~27mm in Y-axis).
      # Root cause is likely camera pose or TF chain offset, not intrinsics.
      # TODO: Fix the underlying ray direction error, then set vfov=54.9.
      horizontal_fov: 69.4
      vertical_fov: 54.9

      # OpenCV frame to Camera frame transformation
      # OpenCV convention: X=right, Y=down, Z=forward (in image)
      # For forward-facing camera pointing along -X axis in base frame
      # Transformation: Y-90° then Z-90° (X-90° then Z-90° gives -X direction)
      opencv_to_camera:
        quaternion: [-0.5, -0.5, 0.5, 0.5]  # Forward-facing camera (-X direction)
    
    # Detection settings
    detection:
      # Ground plane Z coordinate in arm base frame (BEARING_1) in meters.
      # The arm base sits 91mm above the surface the robot drives on.
      ground_plane_z_offset: -0.091
    
    # Transform (TF) configuration
    transforms:
      # Default/Home position of end-effector in base frame
      ee_default:
        position: [-0.19275, 0.0, 0.170]  # meters [x, y, z]
        quaternion: [0.0, 0.7071068, 0.0, 0.7071068]  # [x, y, z, w] - 90° Y rotation
      
      # Default camera pose in base frame (when using ee_default)
      # Camera-to-EE offset is calculated from these two poses
      camera_default:
        position: [-0.058649, 0.000124, 0.042411]  # meters [x, y, z]
        quaternion: [0.0, 0.0, 0.0, 1.0]  # [x, y, z, w] - identity
      
      # Calibration offsets for fine-tuning object positions (meters)
      calibration_offset:
        x: 0.0
        y: 0.0
        z: 0.0

  # --------------------------------------------------------------------------
  # SO-ARM101 Robot Configuration
  # --------------------------------------------------------------------------
  so_arm101:
    # ROS Topics
    topics:
      # Expected message type: geometry_msgs/msg/PoseStamped
      # Published by ee_pose_publisher (base -> gripper TF)
      tcp_pose: '/ee_pose'

    # Camera parameters (wrist-mounted USB camera)
    camera:
      # Camera resolution (pixels)
      width: 1280
      height: 720

      # Field of view (degrees) — 100° HFOV, square pixels
      horizontal_fov: 100.0
      vertical_fov: 67.7

      # OpenCV frame to Camera frame transformation
      # camera_link uses SDF convention: +X=forward, +Y=left, +Z=up
      # Derived from LINK_TO_OPENCV.T quaternion
      opencv_to_camera:
        quaternion: [0.5, -0.5, 0.5, -0.5]

    # Detection settings
    detection:
      # Ground plane Z in base frame (fixed-base arm, legos at Z~0)
      ground_plane_z_offset: 0.0

    # Transform (TF) configuration
    transforms:
      # Default/Home position of end-effector in base frame (at grasp home: wrist_flex=pi/2)
      ee_default:
        position: [0.232134, -0.000177, 0.173270]
        quaternion: [0.000003, -0.000003, -0.024334, 0.999704]

      # Default camera_link pose in base frame (at grasp home)
      camera_default:
        position: [0.237418, 0.061989, 0.162003]
        quaternion: [-0.581167, 0.606593, 0.376952, 0.390124]

      # Calibration offsets for fine-tuning (meters)
      calibration_offset:
        x: 0.0
        y: 0.0
        z: 0.0
